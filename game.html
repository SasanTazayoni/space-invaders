<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Experience a modern adaptation of the classic Space Invaders, featuring aliens with varying projectiles. Relive the nostalgia of the 1978 arcade hit while enjoying innovative gameplay. Test your skills with rapid thought-processing and quick reaction speeds in this retro-inspired gaming experience."
    />
    <meta
      name="keywords"
      content="Space Invaders, classic arcade game, retro gaming, modern adaptation, diverse alien projectiles, gaming history, innovative gameplay, nostalgia, rapid thought-processing, quick reaction speeds, retro-inspired gaming."
    />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" sizes="48x48" href="favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/scripts/shared.js" defer></script>
    <script src="assets/scripts/sound-toggle.js" defer></script>
    <script src="assets/scripts/game.js" defer></script>
    <title>Space Invaders game</title>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Space Invaders</h1>
      <div id="canvas__container">
        <button
          type="button"
          class="sound-toggler"
          aria-label="Sound"
          aria-pressed="true"
          data-sound-toggler
        >
          <svg
            class="icon icon-sound-on"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M1 8h5l7-6v20l-7-6H1z" fill="currentColor" />
            <path
              d="M16 8.5a5 5 0 0 1 0 7M19.5 5a10 10 0 0 1 0 14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <svg
            class="icon icon-sound-off"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M1 8h5l7-6v20l-7-6H1z" fill="currentColor" />
            <path
              d="M16 8.5l7 7M23 8.5l-7 7"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <p id="score"><span>Score:</span> <span data-score>0</span></p>
        <canvas
          class="canvas"
          role="img"
          aria-label="Game area. Move with A and D or the arrow keys, and fire with Space."
          data-canvas
        ></canvas>
      </div>
      <!-- Stage clear modal -->
      <div class="stage-clear-modal" data-stage-clear-modal>
        <p class="stage-clear-message" role="status" data-message></p>
      </div>
      <!-- End game modal -->
      <dialog
        class="end-game-modal"
        aria-labelledby="game-over-title"
        data-end-game-modal
      >
        <div class="animated-text-container" data-animation>
          <span class="visually-hidden">New high score!</span>
          <span class="letters" aria-hidden="true">
            <span style="--i: 0">N</span>
            <span style="--i: 1">E</span>
            <span class="word-end" style="--i: 2">W</span>
            <span style="--i: 3">H</span>
            <span style="--i: 4">I</span>
            <span style="--i: 5">G</span>
            <span class="word-end" style="--i: 6">H</span>
            <span style="--i: 7">S</span>
            <span style="--i: 8">C</span>
            <span style="--i: 9">O</span>
            <span style="--i: 10">R</span>
            <span style="--i: 11">E</span>
          </span>
        </div>
        <h2 id="game-over-title" class="end-game-title">Game over</h2>
        <p data-end-score></p>
        <div class="btn-container">
          <button class="button button--yellow" data-play-btn>
            Play again
          </button>
          <a href="index.html" class="button button--purple" data-menu-btn
            >Main menu</a
          >
        </div>
      </dialog>
    </main>
    <footer>
      <p>&copy; Space Invaders 2023</p>
      <a
        href="https://github.com/SasanTazayoni/space-invaders"
        target="_blank"
        rel="noopener"
        class="github-link"
        aria-label="Source code on GitHub (opens in a new tab)"
      >
        <!-- GitHub mark from Octicons (MIT licence, github.com/primer/octicons) -->
        <svg
          class="icon"
          viewBox="0 0 16 16"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </footer>
  </body>
</html>
